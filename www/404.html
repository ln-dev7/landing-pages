<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Shadcn Pages Free</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link
      rel="icon"
      href="/media/favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <main class="wrap notfound">
      <p class="eyebrow">
        <span class="dot" aria-hidden="true"></span>Error 404
      </p>
      <h1 class="hero__title">This page<br /><em>isn't here.</em></h1>
      <a class="button" href="/collection">Back to the collection</a>
    </main>
    <script src="/analytics.js" defer></script>
  </body>
</html>
